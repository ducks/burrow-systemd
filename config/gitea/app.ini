APP_NAME = Gitea: Git with a cup of tea
RUN_MODE = prod
RUN_USER = gitea

[server]
DOMAIN           = code.jakegoldsborough.com
SSH_DOMAIN       = code.jakegoldsborough.com
HTTP_PORT        = 3000
ROOT_URL         = https://code.jakegoldsborough.com/
DISABLE_SSH      = false
SSH_PORT         = 2222
LFS_START_SERVER = true

[database]
DB_TYPE  = postgres
HOST     = localhost:5432
NAME     = gitea
USER     = gitea
PASSWD   = __GITEA_DB_PASSWORD__
SSL_MODE = disable

[repository]
ROOT = /var/lib/gitea/repositories

[security]
INSTALL_LOCK   = true
SECRET_KEY     = __SECRET_KEY__
INTERNAL_TOKEN = __INTERNAL_TOKEN__

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW  = false

[mailer]
ENABLED = false

[log]
MODE      = file
LEVEL     = info
ROOT_PATH = /var/lib/gitea/log

[session]
PROVIDER = file
